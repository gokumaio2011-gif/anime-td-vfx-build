name: Build Windows Game

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "export_presets.cfg"
      - ".github/workflows/build-windows.yml"

jobs:
  export-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Validate project
        shell: bash
        run: |
          godot --headless --editor --path . --quit

      - name: Export Windows executable
        shell: bash
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" build/AnimeTowerDefense.exe
          test -s build/AnimeTowerDefense.exe

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTowerDefense-Windows
          path: build/AnimeTowerDefense.exe
          if-no-files-found: error
          retention-days: 30
